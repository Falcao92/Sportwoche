<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Boßeln Turnier</title>

<style>
body { font-family: Arial; margin: 20px; }
input, button { margin: 5px; padding: 5px; }
.card { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
.admin { background: #ffe0e0; padding: 10px; }

.bar {
  height: 20px;
  background: steelblue;
  margin-top: 5px;
}
</style>

</head>
<body>

<h1>Boßeln Turnier</h1>

<button onclick="toggleAdmin()">🔑 Admin</button>

<div id="adminArea" style="display:none;" class="admin">
<h2>Team anlegen</h2>

<input id="teamName" placeholder="Teamname"><br>

<input id="playerInput" placeholder="Spielername">
<button onclick="addPlayerInput()">+ Spieler</button>

<div id="playerList"></div>

<button onclick="addTeam()">Team speichern</button>
</div>

<h2>Teams</h2>
<div id="teams"></div>

<h2>Spiele</h2>
<button onclick="generateMatches()">Zufällige Spiele</button>
<div id="matches"></div>

<h2>Ergebnisse</h2>
<div id="results"></div>

<h2>📊 Rangliste</h2>
<div id="chart"></div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let matches = JSON.parse(localStorage.getItem("matches")) || [];

let admin = false;
let tempPlayers = [];

// ADMIN
function toggleAdmin() {
  admin = !admin;
  document.getElementById("adminArea").style.display = admin ? "block" : "none";
}

// SPIELER TEMP
function addPlayerInput() {
  const input = document.getElementById("playerInput");
  const name = input.value.trim();
  if (!name) return;

  tempPlayers.push({
    name,
    id: name + "_" + Date.now()
  });

  input.value = "";
  renderTempPlayers();
}

function renderTempPlayers() {
  const div = document.getElementById("playerList");
  div.innerHTML = "";

  tempPlayers.forEach((p, i) => {
    div.innerHTML += `
      <div>
        ${p.name}
        <button onclick="removeTempPlayer(${i})">❌</button>
      </div>
    `;
  });
}

function removeTempPlayer(i) {
  tempPlayers.splice(i, 1);
  renderTempPlayers();
}

// TEAM
function addTeam() {
  const name = document.getElementById("teamName").value.trim();
  if (!name || tempPlayers.length === 0) return;

  teams.push({
    name,
    members: [...tempPlayers],
    throws: {}
  });

  tempPlayers = [];
  document.getElementById("teamName").value = "";

  saveData();
  renderTempPlayers();
  renderTeams();
}

// TEAM LÖSCHEN
function deleteTeam(i) {
  teams.splice(i, 1);
  saveData();
  renderTeams();
}

// SPEICHERN
function saveData() {
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("matches", JSON.stringify(matches));
}

// TEAMS
function renderTeams() {
  const div = document.getElementById("teams");
  div.innerHTML = "";

  teams.forEach((team, i) => {
    let html = `<div class="card">
      <b>${team.name}</b>
      ${admin ? `<button onclick="deleteTeam(${i})">🗑️</button>` : ""}
      <br><br>`;

    team.members.forEach(p => {
      const val = team.throws[p.id] || "";
      html += `${p.name}: 
        <input type="number" value="${val}"
        ${!admin ? "disabled":""}
        onchange="setThrow(${i}, '${p.id}', this.value)">
        <br>`;
    });

    html += "</div>";
    div.innerHTML += html;
  });

  calculateResults();
}

// WÜRFE
function setThrow(teamIndex, playerId, value) {
  teams[teamIndex].throws[playerId] = Number(value);
  saveData();
  calculateResults();
}

// MATCHES mit 3er Logik
function generateMatches() {
  const shuffled = [...teams].sort(() => Math.random() - 0.5);
  matches = [];

  let i = 0;

  while (i < shuffled.length) {
    if ((shuffled.length - i) === 3) {
      matches.push({
        teams: [
          shuffled[i].name,
          shuffled[i+1].name,
          shuffled[i+2].name
        ],
        start: ""
      });
      break;
    } else {
      matches.push({
        teams: [shuffled[i].name, shuffled[i+1].name],
        start: ""
      });
      i += 2;
    }
  }

  saveData();
  renderMatches();
}

// STARTZEIT
function setStart(i, value) {
  matches[i].start = value;
  saveData();
}

// MATCH ANZEIGE
function renderMatches() {
  const div = document.getElementById("matches");
  div.innerHTML = "";

  matches.forEach((m, i) => {
    div.innerHTML += `
      <div class="card">
        ${m.teams.join(" vs ")}<br>
        Startzeit:
        <input type="time" value="${m.start || ""}"
        ${!admin ? "disabled":""}
        onchange="setStart(${i}, this.value)">
      </div>
    `;
  });
}

// ERGEBNISSE + CHART
function calculateResults() {
  const div = document.getElementById("results");
  const chart = document.getElementById("chart");

  div.innerHTML = "";
  chart.innerHTML = "";

  let ranking = [];

  teams.forEach(team => {
    const values = Object.values(team.throws);
    const total = values.reduce((a,b)=>a+b,0) || 0;
    const avg = values.length ? (total / values.length).toFixed(2) : 0;

    ranking.push({ name: team.name, total });

    div.innerHTML += `
      <div class="card">
        <b>${team.name}</b><br>
        Gesamtwürfe: ${total}<br>
        Durchschnitt: ${avg}
      </div>
    `;
  });

  // SORTIEREN (WICHTIG!)
  ranking.sort((a,b)=>a.total - b.total);

  // MAX für Grafik
  const max = Math.max(...ranking.map(r=>r.total), 1);

  // CHART
  ranking.forEach(r => {
    const width = (r.total / max) * 100;

    chart.innerHTML += `
      <div>
        ${r.name} (${r.total})
        <div class="bar" style="width:${width}%"></div>
      </div>
    `;
  });

  // GEWINNER
  if (ranking.length > 0) {
    chart.innerHTML += `<h2>🏆 Gewinner: ${ranking[0].name}</h2>`;
  }
}

// INIT
renderTeams();
renderMatches();
</script>

</body>
</html>
