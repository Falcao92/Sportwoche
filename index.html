<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Boßeln Turnier</title>

<style>
body { font-family: Arial; margin: 20px; }
input, button { margin: 5px; padding: 5px; }
.card { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
.admin { background: #ffe0e0; padding: 10px; }
.small { font-size: 12px; color: #666; }
</style>

</head>
<body>

<h1>Boßeln Turnier</h1>

<button onclick="toggleAdmin()">🔑 Admin umschalten</button>

<div id="adminArea" style="display:none;" class="admin">
<h2>Team anlegen</h2>
<input id="teamName" placeholder="Teamname">
<br>

<input id="playerInput" placeholder="Spielername">
<button onclick="addPlayerInput()">Spieler hinzufügen</button>

<div id="playerList"></div>

<button onclick="addTeam()">Team speichern</button>
</div>

<h2>Teams</h2>
<div id="teams"></div>

<h2>Spiele</h2>
<button onclick="generateMatches()">Zufällige Spiele</button>
<div id="matches"></div>

<h2>Ergebnisse</h2>
<div id="results"></div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let matches = JSON.parse(localStorage.getItem("matches")) || [];

let admin = false;
let tempPlayers = [];

// ADMIN
function toggleAdmin() {
  admin = !admin;
  document.getElementById("adminArea").style.display = admin ? "block" : "none";
}

// TEMP SPIELER HINZUFÜGEN
function addPlayerInput() {
  const input = document.getElementById("playerInput");
  const name = input.value.trim();
  if (!name) return;

  // einzigartig machen
  tempPlayers.push({
    name: name,
    id: name + "_" + Date.now()
  });

  input.value = "";
  renderTempPlayers();
}

function renderTempPlayers() {
  const div = document.getElementById("playerList");
  div.innerHTML = "";

  tempPlayers.forEach((p, i) => {
    div.innerHTML += `
      <div>
        ${p.name}
        <button onclick="removeTempPlayer(${i})">❌</button>
      </div>
    `;
  });
}

function removeTempPlayer(i) {
  tempPlayers.splice(i, 1);
  renderTempPlayers();
}

// TEAM ERSTELLEN
function addTeam() {
  const name = document.getElementById("teamName").value.trim();
  if (!name || tempPlayers.length === 0) return;

  teams.push({
    name,
    members: [...tempPlayers],
    throws: {}
  });

  document.getElementById("teamName").value = "";
  tempPlayers = [];
  renderTempPlayers();

  saveData();
  renderTeams();
}

// TEAM LÖSCHEN
function deleteTeam(index) {
  teams.splice(index, 1);
  saveData();
  renderTeams();
}

// SPEICHERN
function saveData() {
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("matches", JSON.stringify(matches));
}

// TEAMS ANZEIGE
function renderTeams() {
  const div = document.getElementById("teams");
  div.innerHTML = "";

  teams.forEach((team, tIndex) => {
    let html = `<div class="card">
      <b>${team.name}</b>
      ${admin ? `<button onclick="deleteTeam(${tIndex})">🗑️</button>` : ""}
      <br><br>`;

    team.members.forEach(player => {
      const val = team.throws[player.id] || "";
      html += `
        ${player.name}: 
        <input type="number" value="${val}"
        ${!admin ? "disabled" : ""}
        onchange="setThrow(${tIndex}, '${player.id}', this.value)">
        <br>
      `;
    });

    html += "</div>";
    div.innerHTML += html;
  });

  calculateResults();
}

// WÜRFE
function setThrow(teamIndex, playerId, value) {
  teams[teamIndex].throws[playerId] = Number(value);
  saveData();
  calculateResults();
}

// MATCHES
function generateMatches() {
  const shuffled = [...teams].sort(() => Math.random() - 0.5);
  matches = [];

  for (let i = 0; i < shuffled.length; i += 2) {
    if (shuffled[i + 1]) {
      matches.push({
        a: shuffled[i].name,
        b: shuffled[i + 1].name,
        start: ""
      });
    }
  }

  saveData();
  renderMatches();
}

function setStart(index, value) {
  matches[index].start = value;
  saveData();
}

// MATCH ANZEIGE
function renderMatches() {
  const div = document.getElementById("matches");
  div.innerHTML = "";

  matches.forEach((m, i) => {
    div.innerHTML += `
      <div class="card">
        ${m.a} vs ${m.b}<br>
        Startzeit:
        <input type="time" value="${m.start || ""}"
          ${!admin ? "disabled" : ""}
          onchange="setStart(${i}, this.value)">
      </div>
    `;
  });
}

// ERGEBNISSE
function calculateResults() {
  const div = document.getElementById("results");
  div.innerHTML = "";

  let ranking = [];

  teams.forEach(team => {
    const values = Object.values(team.throws);
    const total = values.reduce((a,b) => a + b, 0) || 0;
    const avg = values.length ? (total / values.length).toFixed(2) : 0;

    ranking.push({ name: team.name, total });

    div.innerHTML += `
      <div class="card">
        <b>${team.name}</b><br>
        Gesamtwürfe: ${total}<br>
        Durchschnitt: ${avg}
      </div>
    `;
  });

  ranking.sort((a,b) => a.total - b.total);

  if (ranking.length > 0) {
    div.innerHTML += `<h2>🏆 Gewinner: ${ranking[0].name}</h2>`;
  }
}

// INIT
renderTeams();
renderMatches();
</script>

</body>
</html>
