<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Boßeln Turnier</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  color: #fff;
  background: linear-gradient(135deg, #1e7f3a, #0b3d1f);
}

/* HEADER */
.header {
  text-align: center;
  padding: 20px;
}

.logo {
  width: 120px;
}

/* BUTTON */
button {
  padding: 6px 10px;
  margin: 5px;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  background: #2ecc71;
  color: white;
}

button:hover {
  background: #27ae60;
}

/* CARDS */
.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 10px;
  padding: 15px;
  margin: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.02);
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

/* SPIELER */
.player-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.player {
  background: rgba(255,255,255,0.15);
  padding: 6px;
  border-radius: 6px;
  transition: 0.2s;
}

.player:hover {
  transform: scale(1.1);
  background: rgba(255,255,255,0.25);
}

/* RANGLISTE */
.bar {
  height: 20px;
  background: limegreen;
  margin-top: 5px;
  border-radius: 4px;
}

.admin {
  padding: 10px;
  background: rgba(255,0,0,0.2);
}

.delete-btn {
  background: red;
  border-radius: 50%;
  font-size: 12px;
  padding: 2px 6px;
}

  
</style>

</head>
<body>

<div class="header">
  <img src="logo.png" class="logo">
  <h1>Boßeln Turnier</h1>
</div>

<button onclick="toggleAdmin()">🔑 Admin</button>

<div id="adminArea" style="display:none;" class="admin">
  <h2>Team anlegen</h2>

  <input id="teamName" placeholder="Teamname">

  <br><br>

  <input id="playerInput" placeholder="Spielername">
  <button onclick="addPlayerInput()">+ Spieler</button>

  <div id="playerList"></div>

  <button onclick="addTeam()">Team speichern</button>
</div>

<h2>Teams</h2>
<div id="teams" class="container"></div>

<h2>Spiele</h2>
<button onclick="generateMatches()">Zufällige Spiele</button>
<div id="matches" class="container"></div>

<h2>Ergebnisse</h2>
<div id="results" class="container"></div>

<h2>📊 Rangliste</h2>
<div id="chart"></div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let matches = JSON.parse(localStorage.getItem("matches")) || [];

let admin = false;
let tempPlayers = [];

function toggleAdmin() {
  admin = !admin;
  document.getElementById("adminArea").style.display = admin ? "block" : "none";
}

// SPIELER
function addPlayerInput() {
  const name = document.getElementById("playerInput").value.trim();
  if (!name) return;

  tempPlayers.push({ name, id: name + "_" + Date.now() });

  document.getElementById("playerInput").value = "";
  renderTempPlayers();
}

function renderTempPlayers() {
  const div = document.getElementById("playerList");
  div.innerHTML = "";

  tempPlayers.forEach((p,i)=>{
    div.innerHTML += `${p.name} <button onclick="removeTempPlayer(${i})">❌</button><br>`;
  });
}

function removeTempPlayer(i) {
  tempPlayers.splice(i,1);
  renderTempPlayers();
}

// TEAM
function addTeam() {
  const name = document.getElementById("teamName").value.trim();

  if (!name || tempPlayers.length === 0) return;

  teams.push({
    name,
    members: [...tempPlayers],
    throws: {}
  });

  tempPlayers = [];
  document.getElementById("teamName").value = "";

  saveData();
  renderTempPlayers();
  renderTeams();
}

function deleteTeam(i) {
  teams.splice(i,1);
  saveData();
  renderTeams();
}

function saveData() {
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("matches", JSON.stringify(matches));
}

// RENDER TEAMS
function renderTeams() {
  const div = document.getElementById("teams");
  div.innerHTML = "";

  teams.forEach((team, i)=>{
    let html = `<div class="card">
      <b>${team.name}</b>
      ${admin ? `<button onclick="deleteTeam(${i})">🗑️</button>`:""}
      
      <div class="player-grid">`;

team.members.forEach((p, pIndex)=>{      

 const val = team.throws[p.id] || "";

  html += `
  <div class="player">
    ${p.name}
    ${admin ? `<button onclick="removePlayer(${i}, ${pIndex})">❌</button>` : ""}
    <br>
    <input type="number" value="${val}"
    ${!admin?"disabled":""}
    onchange="setThrow(${i}, '${p.id}', this.value)">
  </div>`;
});


    html += "</div></div>";
    div.innerHTML += html;
  });

  calculateResults();
}

// WÜRFE
function setThrow(teamIndex, playerId, value) {
  teams[teamIndex].throws[playerId] = Number(value);
  saveData();
  calculateResults();
}

// MATCHES (inkl 3er)
function generateMatches() {
  const shuffled = [...teams].sort(() => Math.random() - 0.5);
  matches = [];

  let i = 0;

  while (i < shuffled.length) {
    if (shuffled.length - i === 3) {
      matches.push({ teams:[
        shuffled[i].name,
        shuffled[i+1].name,
        shuffled[i+2].name
      ], start:""});
      break;
    } else {
      matches.push({ teams:[
        shuffled[i].name,
        shuffled[i+1].name
      ], start:""});
      i += 2;
    }
  }

  saveData();
  renderMatches();
}

function setStart(i, val) {
  matches[i].start = val;
  saveData();
}

// MATCH RENDER
function renderMatches() {
  const div = document.getElementById("matches");
  div.innerHTML = "";

  matches.forEach((m,i)=>{
    div.innerHTML += `<div class="card">
      ${m.teams.join(" vs ")}
${admin ? `<button onclick="deleteMatch(${i})">🗑️</button>` : ""}
<br>
      <input type="time" value="${m.start}"
      ${!admin?"disabled":""}
      onchange="setStart(${i},this.value)">
    </div>`;
  });
}

// ERGEBNIS + CHART
function calculateResults() {
  const res = document.getElementById("results");
  const chart = document.getElementById("chart");

  res.innerHTML="";
  chart.innerHTML="";

  let ranking=[];

  teams.forEach(t=>{
    const vals = Object.values(t.throws);
    const total = vals.reduce((a,b)=>a+b,0)||0;
    const avg = vals.length ? (total/vals.length).toFixed(2):0;

    ranking.push({name:t.name,total});

    res.innerHTML += `<div class="card">
      ${t.name}<br>
      Gesamt: ${total}<br>
      Ø: ${avg}
    </div>`;
  });

  ranking.sort((a,b)=>a.total-b.total);

  const max = Math.max(...ranking.map(r=>r.total),1);

  ranking.forEach(r=>{
    chart.innerHTML += `${r.name} (${r.total})
      <div class="bar" style="width:${(r.total/max)*100}%"></div>`;
  });

  if (ranking.length > 0) {
    chart.innerHTML += `<h2>🏆 ${ranking[0].name}</h2>`;
  }
}
///löschen von Paarungen

  function deleteMatch(index) {
  matches.splice(index, 1);
  saveData();
  renderMatches();
}


  /////spieler löschen
  function removePlayer(teamIndex, playerIndex) {
  const player = teams[teamIndex].members[playerIndex];

  // Würfe entfernen
  delete teams[teamIndex].throws[player.id];

  // Spieler entfernen
  teams[teamIndex].members.splice(playerIndex, 1);

  saveData();
  renderTeams();
}


// INIT
renderTeams();
renderMatches();
</script>

</body>
</html>
