<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Boßeln Turnier</title>

<style>
body { font-family: Arial; margin: 20px; }
input, button { margin: 5px; padding: 5px; }
.card { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
.admin { background: #ffe0e0; padding: 10px; }
</style>

</head>
<body>

<h1>Boßeln Turnier</h1>

<button onclick="toggleAdmin()">🔑 Admin aktivieren</button>

<div id="adminArea" style="display:none;" class="admin">
<h2>Team anlegen</h2>
<input id="teamName" placeholder="Teamname">
<input id="members" placeholder="Mitglieder (Komma getrennt)">
<button onclick="addTeam()">Hinzufügen</button>

<h2>Paarungen</h2>
<button onclick="generateMatches()">Zufällige Spiele</button>
</div>

<h2>Teams</h2>
<div id="teams"></div>

<h2>Spiele</h2>
<div id="matches"></div>

<h2>Ergebnisse</h2>
<div id="results"></div>

<script>
let teams = JSON.parse(localStorage.getItem("teams")) || [];
let matches = JSON.parse(localStorage.getItem("matches")) || [];
let admin = false;

// ADMIN
function toggleAdmin() {
  admin = !admin;
  document.getElementById("adminArea").style.display = admin ? "block" : "none";
}

// TEAM
function addTeam() {
  const name = document.getElementById("teamName").value;
  const members = document.getElementById("members").value.split(",");

  if (!name) return;

  teams.push({ name, members, throws: {} });

  saveData();
  renderTeams();

  document.getElementById("teamName").value = "";
  document.getElementById("members").value = "";
}

// SPEICHERN
function saveData() {
  localStorage.setItem("teams", JSON.stringify(teams));
  localStorage.setItem("matches", JSON.stringify(matches));
}

// TEAMS ANZEIGE
function renderTeams() {
  const div = document.getElementById("teams");
  div.innerHTML = "";

  teams.forEach((team, i) => {
    let html = `<div class="card">
      <b>${team.name}</b><br>
      Mitglieder: ${team.members.join(", ")}<br><br>`;

    team.members.forEach(member => {
      const val = team.throws[member] || "";
      html += `${member}: <input type="number" value="${val}"
        ${!admin ? "disabled" : ""}
        onchange="setThrow(${i}, '${member}', this.value)"> <br>`;
    });

    html += "</div>";
    div.innerHTML += html;
  });

  calculateResults();
}

// WÜRFE
function setThrow(teamIndex, member, value) {
  teams[teamIndex].throws[member] = Number(value);
  saveData();
  calculateResults();
}

// MATCHES
function generateMatches() {
  const shuffled = [...teams].sort(() => Math.random() - 0.5);
  matches = [];

  for (let i = 0; i < shuffled.length; i += 2) {
    if (shuffled[i + 1]) {
      matches.push({
        a: shuffled[i].name,
        b: shuffled[i + 1].name,
        start: ""
      });
    }
  }

  saveData();
  renderMatches();
}

function setStart(index, value) {
  matches[index].start = value;
  saveData();
}

// MATCH ANZEIGE
function renderMatches() {
  const div = document.getElementById("matches");
  div.innerHTML = "";

  matches.forEach((m, i) => {
    div.innerHTML += `<div class="card">
      ${m.a} vs ${m.b}<br>
      Startzeit: 
      <input type="time" value="${m.start}"
      ${!admin ? "disabled" : ""}
      onchange="setStart(${i}, this.value)">
    </div>`;
  });
}

// ERGEBNISSE
function calculateResults() {
  const div = document.getElementById("results");
  div.innerHTML = "";

  let ranking = [];

  teams.forEach(team => {
    const values = Object.values(team.throws);
    const total = values.reduce((a,b) => a + b, 0) || 0;
    const avg = values.length ? (total / values.length).toFixed(2) : 0;

    ranking.push({ name: team.name, total });

    div.innerHTML += `<div class="card">
      <b>${team.name}</b><br>
      Gesamtwürfe: ${total}<br>
      Durchschnitt: ${avg}
    </div>`;
  });

  ranking.sort((a,b) => a.total - b.total);

  if (ranking.length > 0) {
    div.innerHTML += `<h2>🏆 Gewinner: ${ranking[0].name}</h2>`;
  }
}

// INIT
renderTeams();
renderMatches();
</script>

</body>
</html>
